apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: poly-k8
data:
  AUTH_SERVICE_URL: "http://auth-svc.poly-k8.svc.cluster.local:8080"
  ANALYTICS_SERVICE_URL: "http://analytics-svc.poly-k8.svc.cluster.local:8080"
  PROCESSOR_SERVICE_URL: "http://processor-svc.poly-k8.svc.cluster.local:8080"
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-secrets
  namespace: poly-k8
type: Opaque
stringData:
  INTERNAL_API_KEY: "super-secret-k8s-mesh-token"
